<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eleições Municipais 2024 — Gabriel Gonçalves</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage">
      <iframe id="slideFrame" class="slide-frame" src="slides/slide_01.html" title="Slide Atual"></iframe>
    </main>
  </div>

  <!-- Controles fora do palco 1920x1080 -->
  <div class="deck-controls">
    <span class="ctrl-timer" id="timerDisplay" title="Clique ou pressione T para iniciar/pausar (10:00)">10:00</span>
    <button class="ctrl-btn" id="btnPrev" title="Anterior (←)">←</button>
    <span class="ctrl-counter" id="slideCounter">01 / 10</span>
    <button class="ctrl-btn" id="btnNext" title="Próximo (→)">→</button>
    <button class="ctrl-btn" id="btnFull" title="Tela Cheia (F)">⛶</button>
  </div>

  <script>
    class SlidePresentation {
      constructor() {
        this.slides = Array.from({ length: 10 }, (_, i) => `slides/slide_${String(i + 1).padStart(2, '0')}.html`);
        this.stage = document.getElementById('deckStage');
        this.frame = document.getElementById('slideFrame');
        this.counter = document.getElementById('slideCounter');
        this.timerEl = document.getElementById('timerDisplay');
        this.currentSlide = 0;
        this.secondsLeft = 600;
        this.timerId = null;
        this.wheelLock = false;
        this.touchStartX = 0;

        this.setupStageScale();
        this.setupControls();
        this.setupKeyboardNav();
        this.setupWheelNav();
        this.setupTouchNav();
        this.showSlide(0);
      }

      setupStageScale() {
        const scale = () => {
          const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
          const x = (window.innerWidth - 1920 * factor) / 2;
          const y = (window.innerHeight - 1080 * factor) / 2;
          this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener('resize', scale);
      }

      setupControls() {
        document.getElementById('btnPrev').addEventListener('click', () => this.showSlide(this.currentSlide - 1));
        document.getElementById('btnNext').addEventListener('click', () => this.showSlide(this.currentSlide + 1));
        document.getElementById('btnFull').addEventListener('click', () => this.toggleFullscreen());
        this.timerEl.addEventListener('click', () => this.toggleTimer());
      }

      handleKey(key) {
        if (['ArrowRight', 'PageDown', ' '].includes(key)) {
          this.showSlide(this.currentSlide + 1);
        } else if (['ArrowLeft', 'PageUp'].includes(key)) {
          this.showSlide(this.currentSlide - 1);
        } else if (key === 'Home') {
          this.showSlide(0);
        } else if (key === 'End') {
          this.showSlide(this.slides.length - 1);
        } else if (key.toLowerCase() === 't') {
          this.toggleTimer();
        } else if (key.toLowerCase() === 'f') {
          this.toggleFullscreen();
        }
      }

      setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
          if (['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', ' '].includes(e.key)) e.preventDefault();
          this.handleKey(e.key);
        });
        window.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'deck-key') this.handleKey(e.data.key);
        });
      }

      setupWheelNav() {
        window.addEventListener('wheel', (e) => {
          if (this.wheelLock || Math.abs(e.deltaY) < 25) return;
          this.wheelLock = true;
          this.showSlide(this.currentSlide + (e.deltaY > 0 ? 1 : -1));
          setTimeout(() => { this.wheelLock = false; }, 350);
        }, { passive: true });
      }

      setupTouchNav() {
        window.addEventListener('touchstart', (e) => { this.touchStartX = e.changedTouches[0].clientX; }, { passive: true });
        window.addEventListener('touchend', (e) => {
          const dx = e.changedTouches[0].clientX - this.touchStartX;
          if (Math.abs(dx) > 45) this.showSlide(this.currentSlide + (dx < 0 ? 1 : -1));
        }, { passive: true });
      }

      showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.frame.src = this.slides[this.currentSlide];
        this.counter.textContent = `${String(this.currentSlide + 1).padStart(2, '0')} / ${this.slides.length}`;
      }

      toggleTimer() {
        if (this.timerId) {
          clearInterval(this.timerId);
          this.timerId = null;
        } else {
          this.timerId = setInterval(() => {
            this.secondsLeft -= 1;
            const abs = Math.abs(this.secondsLeft);
            const mm = String(Math.floor(abs / 60)).padStart(2, '0');
            const ss = String(abs % 60).padStart(2, '0');
            this.timerEl.textContent = (this.secondsLeft < 0 ? '-' : '') + `${mm}:${ss}`;
            this.timerEl.classList.toggle('warn', this.secondsLeft <= 120 && this.secondsLeft >= 0);
            this.timerEl.classList.toggle('over', this.secondsLeft < 0);
          }, 1000);
        }
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      }
    }

    new SlidePresentation();
  </script>
</body>
</html>
